name: Test provider vertex
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          ai-provider: vertex
          vertex-project-id: fake-gcp-project
          vertex-region: us-central1
          github-token: ${{ github.token }}
      - name: Assert action ran with vertex inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RISK_SCORE: ${{ steps.action.outputs.risk-score }}
          RISK_LEVEL: ${{ steps.action.outputs.risk-level }}
        run: |
          echo "outcome: $OUTCOME"
          echo "risk-score: $RISK_SCORE"
          echo "risk-level: $RISK_LEVEL"
          # The action should either succeed or fail gracefully (not a missing-input error).
          # A missing vertex-project-id would cause a different kind of failure.
          # We accept both success and failure (e.g. API auth error) as valid outcomes
          # since we cannot provide real GCP credentials in CI.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with vertex-project-id input"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
