name: Test valid AI providers are accepted
on:
  workflow_dispatch:
jobs:
  test-openai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action-openai
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-provider: openai

      # The action should fail due to missing PR context (not invalid provider)
      # If provider validation failed, the error message would be different
      - name: Assert openai provider is accepted (fails on PR context, not provider)
        env:
          OUTCOME: ${{ steps.action-openai.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (no PR context), but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: openai provider accepted, action failed on PR context check as expected"

  test-anthropic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action-anthropic
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-provider: anthropic

      - name: Assert anthropic provider is accepted
        env:
          OUTCOME: ${{ steps.action-anthropic.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (no PR context), but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: anthropic provider accepted, action failed on PR context check as expected"

  test-groq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action-groq
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-provider: groq

      - name: Assert groq provider is accepted
        env:
          OUTCOME: ${{ steps.action-groq.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (no PR context), but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: groq provider accepted, action failed on PR context check as expected"

  test-gemini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action-gemini
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-provider: gemini

      - name: Assert gemini provider is accepted
        env:
          OUTCOME: ${{ steps.action-gemini.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (no PR context), but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: gemini provider accepted, action failed on PR context check as expected"
